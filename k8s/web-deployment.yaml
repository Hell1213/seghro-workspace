# Web application deployment — 3 replicas for high availability
# Prerequisites: namespace, configmap, secret, PVC must be applied first
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-web
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-web
        app.kubernetes.io/part-of: sentinel
        app.kubernetes.io/component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Optional: add nodeSelector, tolerations, or affinity for scheduling
      containers:
        - name: sentinel-web
          image: sentinel-web:latest
          # Replace with your container registry:
          # image: ghcr.io/your-org/sentinel-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: db-storage
              mountPath: /app/db
              readOnly: false
          # Optional: add security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: sentinel-db-pvc
      # Optional: topology spread constraints for pod distribution
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sentinel-web
