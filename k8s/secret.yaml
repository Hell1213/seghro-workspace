# Secret template for Sentinel — DO NOT commit real values to version control
#
# Option A: Edit this file with real values, then apply (dev-only):
#   kubectl apply -f k8s/secret.yaml
#
# Option B (recommended for production): Create directly from CLI:
#   kubectl create secret generic sentinel-secrets \
#     --namespace=sentinel \
#     --from-literal=NEXTAUTH_SECRET='your-nextauth-secret-here' \
#     --from-literal=GITHUB_ID='your-github-oauth-app-id' \
#     --from-literal=GITHUB_SECRET='your-github-oauth-app-secret' \
#     --from-literal=ZAI_API_KEY='your-z-ai-api-key'
#
# Option C: Use Sealed Secrets, Vault, or cloud KMS for production
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
  labels:
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  NEXTAUTH_SECRET: "PLACEHOLDER-REPLACE-ME"
  # GitHub OAuth App credentials — https://github.com/settings/developers
  GITHUB_ID: "PLACEHOLDER-REPLACE-ME"
  GITHUB_SECRET: "PLACEHOLDER-REPLACE-ME"
  # Z.ai API key
  ZAI_API_KEY: "PLACEHOLDER-REPLACE-ME"
